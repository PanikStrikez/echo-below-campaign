<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700"><rect width="1300" height="700" fill="#eadfc7"/><rect x="24" y="24" width="1252" height="652" rx="24" fill="#f6ecd7" stroke="#9a805c" stroke-width="6"/><text x="650" y="110" text-anchor="middle" fill="#45392f" font-family="Georgia,serif" font-size="51" font-weight="bold">SESSION 1: RESCUE ROUTE</text><text x="650" y="155" text-anchor="middle" fill="#71614d" font-family="Georgia,serif" font-size="24">Schematic flow, not a geographic map</text><path d="M200 300 H1090" stroke="#9d7c50" stroke-width="18" stroke-linecap="round"/><path d="M410 355 C440 450 530 475 555 520" fill="none" stroke="#b49a75" stroke-width="11" stroke-dasharray="18 12"/><circle cx="125" cy="300" r="75" fill="#354839" stroke="#d4ae68" stroke-width="7"/><text x="125" y="293" text-anchor="middle" fill="#fff2d8" font-family="Arial,sans-serif" font-size="17" font-weight="bold">ROAD SCENE</text><text x="125" y="326" text-anchor="middle" fill="#e4d7b5" font-family="Arial,sans-serif" font-size="13">Gundren rides ahead</text><circle cx="390" cy="300" r="75" fill="#354839" stroke="#d4ae68" stroke-width="7"/><text x="390" y="293" text-anchor="middle" fill="#fff2d8" font-family="Arial,sans-serif" font-size="17" font-weight="bold">AMBUSH</text><text x="390" y="326" text-anchor="middle" fill="#e4d7b5" font-family="Arial,sans-serif" font-size="13">Horses and goblins</text><circle cx="655" cy="300" r="75" fill="#354839" stroke="#d4ae68" stroke-width="7"/><text x="655" y="293" text-anchor="middle" fill="#fff2d8" font-family="Arial,sans-serif" font-size="17" font-weight="bold">GOBLIN TRAIL</text><text x="655" y="326" text-anchor="middle" fill="#e4d7b5" font-family="Arial,sans-serif" font-size="13">Scouting and traps</text><circle cx="920" cy="300" r="75" fill="#354839" stroke="#d4ae68" stroke-width="7"/><text x="920" y="293" text-anchor="middle" fill="#fff2d8" font-family="Arial,sans-serif" font-size="17" font-weight="bold">CAVE MOUTH</text><text x="920" y="326" text-anchor="middle" fill="#e4d7b5" font-family="Arial,sans-serif" font-size="13">Stream and sentries</text><circle cx="1170" cy="300" r="75" fill="#354839" stroke="#d4ae68" stroke-width="7"/><text x="1170" y="293" text-anchor="middle" fill="#fff2d8" font-family="Arial,sans-serif" font-size="17" font-weight="bold">HIDEOUT</text><text x="1170" y="326" text-anchor="middle" fill="#e4d7b5" font-family="Arial,sans-serif" font-size="13">Use published map</text><rect x="448" y="510" width="215" height="82" rx="16" fill="#78644f" stroke="#c5aa80" stroke-width="5"/><text x="555" y="548" text-anchor="middle" fill="#fff2d8" font-family="Arial,sans-serif" font-size="22" font-weight="bold">PHANDALIN</text><text x="555" y="575" text-anchor="middle" fill="#e8d7b8" font-family="Arial,sans-serif" font-size="16">If the party turns back</text><text x="650" y="650" text-anchor="middle" fill="#6c5c49" font-family="Georgia,serif" font-size="20">No required route: the rescue lead remains available.</text></svg>