<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
 <title id="title">Mending Court</title><desc id="desc">An original illustrative home plan with a north passage, west lodging, east bindery, central well, south covered table, pantry and side stair. Not to scale.</desc>
 <defs>
  <pattern id="stone" width="90" height="60" patternUnits="userSpaceOnUse"><rect width="90" height="60" fill="#b5ac92"/><path d="M0 0H90M0 30H90M45 0V30M15 30V60M75 30V60" stroke="#887f6b" stroke-width="2"/><path d="M4 4H41M49 34H70" stroke="#cec6ac" stroke-width="2" opacity=".6"/></pattern>
  <pattern id="floor" width="28" height="110" patternUnits="userSpaceOnUse"><rect width="28" height="110" fill="#8a6b47"/><path d="M0 0V110M28 0V110M0 38H28" stroke="#5d4734" stroke-width="2"/></pattern>
  <pattern id="roof" width="38" height="23" patternUnits="userSpaceOnUse"><rect width="38" height="23" fill="#455e58"/><path d="M0 0H38M19 0V23" stroke="#2c433f" stroke-width="2"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="4" dy="6" stdDeviation="5" flood-opacity=".3"/></filter>
 </defs>
